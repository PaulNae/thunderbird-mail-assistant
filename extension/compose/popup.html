<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="../shared/popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="compose">
    <section id="consent" class="consent" hidden></section>
    <div id="app" hidden>
    <h1 data-i18n="popupComposeTitle"></h1>
    <p id="scope" class="scope"></p>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="actions">
      <div class="row">
        <button type="button" data-action="rephrase" data-i18n="composeRephrase"></button>
        <button type="button" data-action="shorten" data-i18n="composeShorten"></button>
      </div>
      <div class="row" role="group" aria-labelledby="tone-label">
        <span class="label" id="tone-label" data-i18n="composeToneLabel"></span>
        <button type="button" data-action="tone:friendly" data-i18n="composeToneFriendly"></button>
        <button type="button" data-action="tone:formal" data-i18n="composeToneFormal"></button>
        <button type="button" data-action="tone:concise" data-i18n="composeToneConcise"></button>
      </div>
      <div class="row" role="group" aria-labelledby="translate-label">
        <span class="label" id="translate-label" data-i18n="composeTranslateLabel"></span>
        <button type="button" data-action="translate:de" data-i18n="composeTranslateDe"></button>
        <button type="button" data-action="translate:en" data-i18n="composeTranslateEn"></button>
      </div>
      <p id="instruction-label" class="label" data-i18n="composeDraftLabel" hidden></p>
      <div class="row">
        <input type="text" id="instruction" data-i18n-placeholder="composeInstructionPlaceholder" />
        <button type="button" id="run-custom" data-i18n="composeRun" disabled></button>
      </div>
    </section>

    <section id="reply-section" hidden>
      <h2 data-i18n="composeReplyTitle"></h2>
      <div class="row">
        <input type="text" id="reply-notes" data-i18n-placeholder="composeReplyNotesPlaceholder" />
        <button type="button" id="run-reply" data-i18n="composeReplyRun" disabled></button>
      </div>
    </section>

    <section id="preview-section" hidden>
      <pre id="preview" tabindex="0" aria-live="polite"></pre>
      <div class="row">
        <button type="button" id="cancel" data-i18n="composeCancel" hidden></button>
        <button type="button" id="apply" data-i18n="composeApply" hidden></button>
        <button type="button" id="discard" data-i18n="composeDiscard" hidden></button>
        <button type="button" id="regenerate" data-i18n="composeRegenerate" hidden></button>
      </div>
    </section>
    </div>
  </body>
</html>
